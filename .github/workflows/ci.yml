name: CI

on:
  push:
    branches:
      - main
      - feature/*
      - hotfix/*
  pull_request:
    branches:
      - main
      - feature/*
      - hotfix/*
  # Cho phép chạy thủ công từ tab Actions.
  workflow_dispatch:
  # Quét định kỳ hàng tuần để bắt issue bảo mật kể cả khi không có commit mới.
  schedule:
    - cron: "17 2 * * 1"

jobs:
  build-test:
    # Luồng kiểm tra chất lượng cơ bản: format/lint/typecheck/test.
    # Bỏ qua khi chạy theo lịch để tránh tốn phút CI không cần thiết.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: toxic-cmt-clf

      - name: Install pre-commit
        run: conda run -n toxic-cmt-clf pre-commit install

      - name: Run pre-commit (format, lint, typecheck)
        run: conda run -n toxic-cmt-clf pre-commit run --all-files

      - name: Run pytest
        run: conda run -n toxic-cmt-clf pytest --maxfail=2 --disable-warnings

  semgrep-ce:
    name: semgrep/ce
    # Luồng SAST bằng Semgrep CE, xuất SARIF để hiển thị trong GitHub Code Scanning.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Run Semgrep CE
        id: semgrep_scan
        shell: bash
        # Không fail ngay để luôn có cơ hội upload SARIF; trạng thái pass/fail xử lý ở bước cuối.
        run: |
          set +e
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --error \
            --sarif \
            --output semgrep.sarif \
            .
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF report
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

      - name: Enforce Semgrep result
        shell: bash
        # Quy đổi exit code thành kết quả CI rõ ràng.
        run: |
          code="${{ steps.semgrep_scan.outputs.exit_code }}"
          if [ "$code" = "0" ]; then
            echo "Semgrep scan passed with no blocking findings."
            exit 0
          fi

          if [ "$code" = "1" ]; then
            echo "Semgrep found findings (blocked by --error)."
            exit 1
          fi

          echo "Semgrep scan failed with execution error code: $code"
          exit "$code"
